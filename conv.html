<script>
    const scriptDir = "data/script";

    const $table = $('#table');

    $(document).ready(function () {
        $table.bootstrapTable();

        updateTable("yell");

    });

    function updateTable(scriptFileName) {

        let dir = `${scriptDir}/${scriptFileName}.txt`;

        const scriptPromise = $.get(dir, function (fileData) {
        }, 'text');

        Promise.all([scriptPromise])
            .then(([scriptData]) => {
                let result = PARSER_FE9.parseScript(scriptData);
                $table.bootstrapTable('load', result);
            })
            .catch(error => {
                console.error("Error loading script data:", error);
            });
    }

    $scriptDropdown.on('select2:select', function (e) {
        updateTable(e.params.data.id);
    });


    function scrollTop_func() {
        $('html, body').animate({
            scrollTop: $("#navBar").offset().top
        }, 100, 'linear');
    }

</script>
